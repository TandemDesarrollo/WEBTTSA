server {
    listen 8080;
    listen [::]:8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Seguridad básica
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresión
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Resolver el contenedor de nuevo cuando Compose recrea la API.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    location = /api/contact {
        client_max_body_size 32k;
        set $mail_api mail-api:8000;
        proxy_pass http://$mail_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 300s;
        # Un POST puede haber enviado el correo aunque se pierda su respuesta.
        proxy_next_upstream off;
        proxy_intercept_errors off;
        error_page 413 = @contact_too_large;
        error_page 502 = @contact_unavailable;
        error_page 504 = @contact_timeout;
    }

    location @contact_too_large {
        default_type application/json;
        return 413 '{"ok":false,"message":"La consulta supera el tamaño permitido."}';
    }

    location @contact_unavailable {
        default_type application/json;
        return 502 '{"ok":false,"message":"No pudimos confirmar el envío de tu consulta. Podés escribirnos a info@tandemtech.com.ar."}';
    }

    location @contact_timeout {
        default_type application/json;
        return 504 '{"ok":false,"message":"No pudimos confirmar el envío de tu consulta. Podés escribirnos a info@tandemtech.com.ar."}';
    }

    # Assets con cache larga (nombres estables)
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # No exponer archivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
